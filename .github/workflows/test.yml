name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Check that dist/ is up to date
        run: git diff --exit-code dist/ || (echo "Run npm run build and commit dist/" && exit 1)
